# Development overrides — auto-merged by `docker compose up`
services:
  # En desarrollo las migraciones salen del código montado (incluye las nuevas).
  migrate:
    build:
      dockerfile: apps/api/Dockerfile.dev
    image: tienda3d-api-dev:local
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
      - /app/apps/api/node_modules
    command: sh -c "cd apps/api && pnpm prisma:generate && sh scripts/migrate.sh"

  api:
    build:
      dockerfile: apps/api/Dockerfile.dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
    # Antes de arrancar Nest en watch mode, regenera el cliente Prisma (refleja
    # cambios del schema montado por volumen). Las migraciones las aplica el
    # servicio `migrate`.
    command: sh -c "pnpm --filter @tienda3d/shared build && cd apps/api && pnpm prisma:generate && pnpm dev"

  web:
    build:
      dockerfile: apps/web/Dockerfile.dev
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://api:3001
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/packages/shared/node_modules
    command: sh -c "pnpm --filter @tienda3d/shared build && pnpm --filter @tienda3d/web dev"
